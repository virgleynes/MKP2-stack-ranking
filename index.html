<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack rank — Marketplace friction prioritization</title>
    <style>
      :root {
        --bg: #061428;
        --panel: #0a1c36;
        --panel-border: rgba(129, 242, 254, 0.45);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.72);
        --divider: rgba(255, 255, 255, 0.18);
        --agave: #81f2fe;
        --badge-text: #061428;
        --action-radius: 6px;
        --font: "Avenir Next forINTUIT", "Avenir Next", Avenir, -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body.stack-rank {
        min-height: 100vh;
        font-family: var(--font);
        color: var(--text);
        background: var(--bg);
      }

      .stack-rank__app {
        max-width: 1760px;
        margin: 0 auto;
        padding: 40px 80px 48px;
      }

      .stack-rank__panel {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 88px);
        padding: 40px 48px 24px;
        border: 1px solid var(--panel-border);
        border-radius: 4px;
        background: linear-gradient(
          180deg,
          rgba(10, 28, 54, 0.96) 0%,
          rgba(6, 20, 40, 0.98) 100%
        );
        box-shadow: 0 0 0 1px rgba(129, 242, 254, 0.08),
          0 0 40px rgba(129, 242, 254, 0.08);
      }

      .stack-rank__top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 28px;
      }

      .stack-rank__heading {
        margin: 0;
        max-width: 720px;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.25;
        color: var(--text);
      }

      .stack-rank__hint {
        margin: 8px 0 0;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.4;
        color: var(--text-muted);
      }

      .stack-rank__name {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        flex: 1;
        max-width: 804px;
        min-width: 280px;
      }

      .stack-rank__name-label {
        flex-shrink: 0;
        font-size: 20px;
        font-weight: 400;
        line-height: 1.2;
        white-space: nowrap;
      }

      .stack-rank__name-input {
        flex: 1;
        min-width: 0;
        padding: 4px 0 6px;
        border: 0;
        border-bottom: 1px solid var(--text);
        background: transparent;
        font-family: inherit;
        font-size: 20px;
        font-weight: 400;
        line-height: 1.2;
        color: var(--text);
        outline: none;
      }

      .stack-rank__name-input:focus {
        border-bottom-color: var(--agave);
      }

      .stack-rank__table {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .stack-rank__header {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) 40px;
        align-items: center;
        gap: 24px;
        padding: 0 0 16px;
        border-bottom: 1px solid var(--divider);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.2;
      }

      .stack-rank__header-rank {
        text-align: center;
      }

      .stack-rank__body {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr);
        align-items: start;
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding-right: 4px;
      }

      .stack-rank__ranks {
        display: flex;
        flex-direction: column;
      }

      .stack-rank__rank {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 68px;
        padding: 12px 0;
        border-bottom: 1px solid var(--divider);
      }

      .stack-rank__badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 43px;
        height: 43px;
        border-radius: 9999px;
        background: var(--agave);
        color: var(--badge-text);
        font-size: 20px;
        font-weight: 600;
        line-height: 1;
      }

      .stack-rank__sortable {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .stack-rank__row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px;
        align-items: center;
        gap: 24px;
        min-height: 68px;
        padding: 12px 0;
        border-bottom: 1px solid var(--divider);
        font-size: 24px;
        font-weight: 500;
        line-height: 1.35;
        background: transparent;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .stack-rank__row:active {
        cursor: grabbing;
      }

      .stack-rank__row--dragging {
        opacity: 0.4;
      }

      .stack-rank__row--over {
        box-shadow: inset 0 3px 0 var(--agave);
      }

      .stack-rank__row-type {
        word-break: break-word;
      }

      .stack-rank__handle {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 40px;
        pointer-events: none;
      }

      .stack-rank__handle-line {
        display: block;
        width: 40px;
        height: 3px;
        border-radius: 2px;
        background: var(--text);
      }

      .stack-rank__actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
        padding: 16px 10px 8px;
      }

      .stack-rank__btn {
        min-width: 80px;
        padding: 12px 24px;
        border-radius: var(--action-radius);
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.25;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease,
          color 0.15s ease;
      }

      .stack-rank__btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .stack-rank__btn--secondary {
        border: 1px solid var(--text);
        background: transparent;
        color: var(--text);
      }

      .stack-rank__btn--secondary:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.08);
      }

      .stack-rank__btn--primary {
        border: 1px solid var(--text);
        background: var(--text);
        color: var(--bg);
      }

      .stack-rank__btn--primary:hover:not(:disabled) {
        background: var(--agave);
        border-color: var(--agave);
        color: var(--badge-text);
      }

      .stack-rank__submit-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .stack-rank__error {
        margin: 0;
        font-size: 14px;
        color: #ff8a8a;
        text-align: right;
      }

      .stack-rank__success {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: calc(100vh - 96px);
        padding: 40px 24px;
        text-align: center;
      }

      .stack-rank__app[data-phase="success"] .stack-rank__panel {
        display: none;
      }

      .stack-rank__app[data-phase="success"] .stack-rank__success {
        display: flex;
      }

      .stack-rank__success-illustration {
        width: 240px;
        height: 240px;
      }

      .stack-rank__success-title {
        margin: 0;
        max-width: 480px;
        font-size: 40px;
        font-weight: 500;
        line-height: 1.15;
        color: var(--text);
      }

      @media (max-width: 1100px) {
        .stack-rank__app {
          padding: 24px;
        }

        .stack-rank__panel {
          padding: 28px 24px 16px;
        }

        .stack-rank__heading,
        .stack-rank__header,
        .stack-rank__row {
          font-size: 18px;
        }

        .stack-rank__top {
          flex-direction: column;
          align-items: stretch;
        }

        .stack-rank__name {
          max-width: none;
        }

        .stack-rank__header,
        .stack-rank__body {
          grid-template-columns: 64px minmax(0, 1fr);
        }

        .stack-rank__header {
          grid-template-columns: 64px minmax(0, 1fr) 32px;
          gap: 12px;
        }

        .stack-rank__row {
          grid-template-columns: minmax(0, 1fr) 32px;
          gap: 12px;
        }

        .stack-rank__badge {
          width: 36px;
          height: 36px;
          font-size: 16px;
        }
      }

      @media (max-width: 640px) {
        .stack-rank__app {
          padding: 16px;
        }

        .stack-rank__heading,
        .stack-rank__name-label,
        .stack-rank__name-input {
          font-size: 16px;
        }

        .stack-rank__hint {
          font-size: 14px;
        }

        .stack-rank__name {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }

        .stack-rank__header {
          display: none;
        }

        .stack-rank__body {
          grid-template-columns: 48px 1fr;
        }

        .stack-rank__rank,
        .stack-rank__row {
          min-height: 56px;
          font-size: 15px;
        }

        .stack-rank__actions {
          flex-direction: column-reverse;
          align-items: stretch;
        }

        .stack-rank__submit-wrap {
          align-items: stretch;
        }

        .stack-rank__btn {
          width: 100%;
        }

        .stack-rank__error {
          text-align: left;
        }

        .stack-rank__success-title {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body class="stack-rank">
    <div class="stack-rank__app" data-phase="form">
      <div class="stack-rank__panel">
        <div class="stack-rank__top">
          <div>
            <h1 class="stack-rank__heading">
              Stack ranking Marketplace page content by level of importance
            </h1>
            <p class="stack-rank__hint">
              Drag rows so Rank 1 is the most important and Rank 11 is the least important. When
              you’re done, press Submit.
            </p>
          </div>

          <div class="stack-rank__name">
            <label class="stack-rank__name-label" for="stack-rank-name">Your full name:</label>
            <input
              class="stack-rank__name-input"
              id="stack-rank-name"
              name="fullName"
              type="text"
              autocomplete="name"
              required
            />
          </div>
        </div>

        <div class="stack-rank__table" role="region" aria-label="Friction ranking table">
          <div class="stack-rank__header" aria-hidden="true">
            <span class="stack-rank__header-rank">Rank</span>
            <span>Information type</span>
            <span></span>
          </div>

          <div class="stack-rank__body">
            <div class="stack-rank__ranks" aria-hidden="true" id="stack-rank-ranks"></div>
            <div
              class="stack-rank__sortable"
              id="stack-rank-sortable"
              role="list"
              aria-label="Draggable friction rows"
            ></div>
          </div>
        </div>

        <div class="stack-rank__actions">
          <button type="button" class="stack-rank__btn stack-rank__btn--secondary" id="stack-rank-reset">
            Reset
          </button>
          <div class="stack-rank__submit-wrap">
            <p class="stack-rank__error" id="stack-rank-error" hidden role="alert"></p>
            <button type="button" class="stack-rank__btn stack-rank__btn--primary" id="stack-rank-submit">
              Submit
            </button>
          </div>
        </div>
      </div>

      <div class="stack-rank__success" role="status" aria-live="polite">
        <img
          class="stack-rank__success-illustration"
          src="assets/celebration.svg"
          alt=""
          width="240"
          height="240"
        />
        <h1 class="stack-rank__success-title">Thank you for your input!</h1>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        /**
         * Paste your deployed Google Apps Script web app URL here after SETUP.md.
         * Leave empty to demo the UI without writing to Sheets.
         */
        var GOOGLE_SCRIPT_URL = '';

        var DEFAULT_ITEMS = [
          {
            id: 'application-process-info',
            type: 'Lack of information about the application process'
          },
          {
            id: 'personalized-terms',
            type: "Offer terms aren't personalized to my business"
          },
          {
            id: 'loan-product-unfamiliar',
            type:
              'Unfamiliar and lack of information on a loan product (eg. line of credit, term loan, etc)'
          },
          {
            id: 'timing',
            type: "Timing isn't right / need more time to decide"
          },
          {
            id: 'repayment-cost-high',
            type: 'Repayment cost is too high, or higher than expected'
          },
          {
            id: 'compare-repayment',
            type: 'Hard to compare repayment cost between the different loan offers'
          },
          {
            id: 'fear-rejection',
            type: 'Fear of rejection'
          },
          {
            id: 'fear-credit-check',
            type: 'Fear of a credit check'
          },
          {
            id: 'amount-too-small',
            type: 'Amount too small to be worth it'
          },
          {
            id: 'distrust-lender',
            type: 'Distrust of or unfamiliar with a particular lender'
          },
          {
            id: 'get-started-commitment',
            type: 'Unclear what the clicking on “Get started” commits you to'
          }
        ];

        var RANK_COUNT = DEFAULT_ITEMS.length;

        var app = document.querySelector('.stack-rank__app');
        var nameInput = document.getElementById('stack-rank-name');
        var ranksEl = document.getElementById('stack-rank-ranks');
        var sortable = document.getElementById('stack-rank-sortable');
        var resetBtn = document.getElementById('stack-rank-reset');
        var submitBtn = document.getElementById('stack-rank-submit');
        var errorEl = document.getElementById('stack-rank-error');

        if (!app || !sortable || !ranksEl) return;

        var items = DEFAULT_ITEMS.slice();
        var dragState = { sourceId: null, overId: null };

        function renderRanks() {
          var html = '';
          for (var i = 1; i <= RANK_COUNT; i++) {
            html +=
              '<div class="stack-rank__rank"><span class="stack-rank__badge">' +
              i +
              '</span></div>';
          }
          ranksEl.innerHTML = html;
        }

        function renderRows() {
          sortable.innerHTML = items
            .map(function (item) {
              return (
                '<div class="stack-rank__row" draggable="true" data-id="' +
                item.id +
                '" role="listitem" aria-grabbed="false">' +
                '<span class="stack-rank__row-type">' +
                item.type +
                '</span>' +
                '<span class="stack-rank__handle" aria-hidden="true">' +
                '<span class="stack-rank__handle-line"></span>' +
                '<span class="stack-rank__handle-line"></span>' +
                '</span>' +
                '</div>'
              );
            })
            .join('');

          bindRowEvents();
        }

        function moveItem(sourceId, targetId) {
          if (sourceId === targetId) return;

          var sourceIndex = items.findIndex(function (item) {
            return item.id === sourceId;
          });
          var targetIndex = items.findIndex(function (item) {
            return item.id === targetId;
          });

          if (sourceIndex < 0 || targetIndex < 0) return;

          var next = items.slice();
          var removed = next.splice(sourceIndex, 1)[0];
          next.splice(targetIndex, 0, removed);
          items = next;
          renderRows();
        }

        function clearDragStyles() {
          sortable.querySelectorAll('.stack-rank__row').forEach(function (row) {
            row.classList.remove('stack-rank__row--dragging', 'stack-rank__row--over');
            row.setAttribute('aria-grabbed', 'false');
          });
          dragState.sourceId = null;
          dragState.overId = null;
        }

        function bindRowEvents() {
          sortable.querySelectorAll('.stack-rank__row').forEach(function (row) {
            row.addEventListener('dragstart', onDragStart);
            row.addEventListener('dragend', onDragEnd);
            row.addEventListener('dragover', onDragOver);
            row.addEventListener('dragleave', onDragLeave);
            row.addEventListener('drop', onDrop);
          });
        }

        function onDragStart(event) {
          var row = event.currentTarget;
          dragState.sourceId = row.dataset.id;
          row.classList.add('stack-rank__row--dragging');
          row.setAttribute('aria-grabbed', 'true');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', row.dataset.id);
        }

        function onDragEnd() {
          clearDragStyles();
        }

        function onDragOver(event) {
          event.preventDefault();
          var row = event.currentTarget;
          if (row.dataset.id === dragState.sourceId) return;

          sortable.querySelectorAll('.stack-rank__row').forEach(function (el) {
            el.classList.remove('stack-rank__row--over');
          });
          row.classList.add('stack-rank__row--over');
          dragState.overId = row.dataset.id;
          event.dataTransfer.dropEffect = 'move';
        }

        function onDragLeave(event) {
          var row = event.currentTarget;
          if (!row.contains(event.relatedTarget)) {
            row.classList.remove('stack-rank__row--over');
          }
        }

        function onDrop(event) {
          event.preventDefault();
          var targetId = event.currentTarget.dataset.id;
          var sourceId = dragState.sourceId || event.dataTransfer.getData('text/plain');
          moveItem(sourceId, targetId);
          clearDragStyles();
        }

        function resetRanking() {
          items = DEFAULT_ITEMS.slice();
          renderRows();
          if (errorEl) {
            errorEl.hidden = true;
            errorEl.textContent = '';
          }
        }

        function getRankingsPayload() {
          return items.map(function (item, index) {
            return {
              rank: index + 1,
              id: item.id,
              type: item.type
            };
          });
        }

        function showSuccess() {
          app.dataset.phase = 'success';
          document.title = 'Thank you — Stack rank';
        }

        function showError(message) {
          if (!errorEl) return;
          errorEl.hidden = false;
          errorEl.textContent = message;
        }

        function submitRanking() {
          var name = (nameInput && nameInput.value.trim()) || '';

          if (!name) {
            showError('Please enter your full name before submitting.');
            if (nameInput) nameInput.focus();
            return;
          }

          if (errorEl) {
            errorEl.hidden = true;
            errorEl.textContent = '';
          }

          var payload = {
            timestamp: new Date().toISOString(),
            name: name,
            rankings: getRankingsPayload()
          };

          submitBtn.disabled = true;
          resetBtn.disabled = true;

          if (!GOOGLE_SCRIPT_URL) {
            console.info('Stack rank submission (Google Sheet URL not configured):', payload);
            showSuccess();
            return;
          }

          fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          })
            .then(function () {
              showSuccess();
            })
            .catch(function () {
              showError('Something went wrong while submitting. Please try again.');
              submitBtn.disabled = false;
              resetBtn.disabled = false;
            });
        }

        resetBtn.addEventListener('click', resetRanking);
        submitBtn.addEventListener('click', submitRanking);

        renderRanks();
        renderRows();
      })();
    </script>
  </body>
</html>
